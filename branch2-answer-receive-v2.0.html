<!-- 项目：分支2 双手机拍题作答中继｜作用：手机B接收手机A的AI做题结果，以文字突出显示答案并保留完整题目与解析｜版本：v2.0｜日期：2026-09-10 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>分支2｜手机B文字答案</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:720px;margin:auto;padding:18px}h1{font-size:23px}.sub{color:#9aa7b7;font-size:14px;line-height:1.6}.c{background:#121821;border:1px solid #263140;border-radius:16px;padding:14px;margin-top:13px}label{display:block;color:#cbd4df;font-size:12px;margin-bottom:5px}input{width:100%;padding:11px;background:#0c1219;color:#fff;border:1px solid #334154;border-radius:10px}.mono{font-family:monospace}button{width:100%;border:0;border-radius:11px;padding:13px;background:#2389ff;color:#fff;font-weight:700;font-size:15px;margin-top:9px}.red{background:#7a2529}.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g button{background:#283342}.status{margin-top:9px;color:#9aa7b7;font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:7px}.live .dot{background:#38d47a}.ans{margin-top:10px;background:#0c1b13;border:1px solid #2b6844;border-radius:13px;padding:15px;min-height:92px}.lab{font-size:12px;color:#8fd8aa;margin-bottom:7px}.txt{font-size:22px;font-weight:800;line-height:1.5;white-space:pre-wrap;word-break:break-word}.full{margin-top:12px;background:#0c1219;border:1px solid #263140;border-radius:11px;padding:14px;min-height:150px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.meta{font-size:12px;color:#9aa7b7;margin-top:8px}.hist{display:grid;gap:8px;margin-top:10px}.item{background:#0c1219;border:1px solid #263140;border-radius:10px;padding:10px}.time{font-size:11px;color:#7f8c9d;margin-bottom:5px}.itemtxt{font-size:13px;white-space:pre-wrap;line-height:1.5}.empty{color:#8795a7;font-size:13px}</style></head><body><div class="w"><h1>分支2｜手机 B：文字答案终端</h1><div class="sub">这台手机只接收。收到手机 A 的结果后，<b>答案会放大显示</b>，下方保留完整题目、答案和解析。</div><section class="c" id="card"><label>配对码</label><input id="room" class="mono"><button id="listen">启动接收</button><button id="stop" class="red" disabled>停止接收</button><div id="status" class="status"><span class="dot"></span>尚未连接</div></section><section class="c"><div class="ans"><div class="lab">最新文字答案</div><div id="answer" class="txt">等待手机 A…</div></div><div id="meta" class="meta">尚未收到结果</div><div class="g"><button id="copy">复制答案</button><button id="clear">清空记录</button></div><div id="full" class="full">完整的【题目】【答案】【解析】会显示在这里。</div></section><section class="c"><b>最近收到的答案</b><div id="hist" class="hist"><div class="empty">暂无记录</div></div></section></div><script>(()=>{const N='https://ntfy.sh',$=id=>document.getElementById(id),room=$('room'),status=$('status'),card=$('card'),answer=$('answer'),full=$('full'),meta=$('meta'),hist=$('hist'),listen=$('listen'),stop=$('stop');let es=null,last='',records=[];function sr(s){return(s||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,64)}function extract(t){let m=String(t||'').match(/【答案】\s*([\s\S]*?)(?=\n?【解析】|$)/);return(m?m[1]:t||'').trim()||'未提取到答案'}function render(){hist.innerHTML='';if(!records.length){hist.innerHTML='<div class="empty">暂无记录</div>';return}records.slice(0,10).forEach(r=>{let d=document.createElement('div'),tm=document.createElement('div'),tx=document.createElement('div');d.className='item';tm.className='time';tx.className='itemtxt';tm.textContent=new Date(r.createdAt).toLocaleString('zh-CN',{hour12:false});tx.textContent=extract(r.text);d.append(tm,tx);hist.appendChild(d)})}function show(p){let t=String(p.text||'').trim();if(!t)return;answer.textContent=extract(t);full.textContent=t;meta.textContent='收到时间：'+new Date(p.createdAt||Date.now()).toLocaleString('zh-CN',{hour12:false});records.unshift({createdAt:p.createdAt||Date.now(),text:t});records=records.slice(0,10);render()}function start(){let r=sr(room.value);if(!r){status.textContent='请先填写配对码';return}if(!('EventSource'in window)){status.textContent='当前浏览器不支持实时接收';return}if(es)es.close();es=new EventSource(N+'/'+encodeURIComponent('cai-'+r)+'/sse');card.classList.add('live');listen.disabled=true;stop.disabled=false;room.disabled=true;localStorage.setItem('branch2_qa_room',r);status.innerHTML='<span class="dot"></span>正在连接…';es.onopen=()=>status.innerHTML='<span class="dot"></span>已连接，等待手机 A 拍题';es.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.event!=='message'||!d.message)return;if(d.id&&d.id===last)return;last=d.id||'';let p;try{p=JSON.parse(d.message)}catch{p={createdAt:Date.now(),text:d.message}};show(p);status.innerHTML='<span class="dot"></span>已收到新答案，继续等待'}catch{}};es.onerror=()=>status.innerHTML='<span class="dot"></span>连接中断，正在自动重连…'}function end(){if(es){es.close();es=null}card.classList.remove('live');listen.disabled=false;stop.disabled=true;room.disabled=false;status.innerHTML='<span class="dot"></span>已停止'}let q=new URLSearchParams(location.search).get('room');room.value=sr(q||localStorage.getItem('branch2_qa_room')||'');room.onchange=()=>localStorage.setItem('branch2_qa_room',sr(room.value));listen.onclick=start;stop.onclick=end;$('copy').onclick=async()=>{let t=answer.textContent.trim();try{await navigator.clipboard.writeText(t);meta.textContent='答案已复制'}catch{prompt('复制答案：',t)}};$('clear').onclick=()=>{records=[];render()}})();</script></body></html>
