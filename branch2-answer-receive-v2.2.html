<!--
项目：分支2｜双手机整页试卷答案中继
页面：手机 B（接收 / 题号+答案）
作用：手机 B 不拍照、不调用 Gemini；只接收手机 A 的整页作答结果，并显示“题号 + 答案”。
版本：v2.2-branch2-answer-only
修改日期：2026-09-10
基础版本：v2.1-branch2-full-paper-answer
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>分支2 v2.2｜手机B 答案清单</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px}
h1{font-size:24px;margin:4px 0 8px}
.sub{color:#9aa7b7;font-size:14px;line-height:1.6}
.card{background:#121821;border:1px solid #263140;border-radius:18px;padding:14px;margin-top:14px}
label{display:block;color:#cbd4df;font-size:13px;margin-bottom:6px}
input{width:100%;border:1px solid #334154;background:#0c1219;color:#fff;border-radius:11px;padding:11px 12px;font-size:14px}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
button{width:100%;border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:700;background:#2389ff;color:#fff;margin-top:10px}
button.stop{background:#7a2529}
.status{margin-top:10px;color:#9aa7b7;font-size:13px;white-space:pre-wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:7px}
.live .dot{background:#38d47a}
.answers{margin-top:10px;background:#0c1b13;border:1px solid #2b6844;border-radius:14px;padding:16px;min-height:180px}
.label{font-size:12px;color:#8fd8aa;margin-bottom:8px}
.answerText{font-size:20px;font-weight:750;line-height:1.72;white-space:pre-wrap;word-break:break-word}
.meta{font-size:12px;color:#9aa7b7;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 button{margin-top:10px;background:#283342}
.history{margin-top:10px;display:grid;gap:8px}
.item{background:#0c1219;border:1px solid #263140;border-radius:10px;padding:10px}
.itemTime{font-size:11px;color:#7f8c9d;margin-bottom:5px}
.itemText{white-space:pre-wrap;line-height:1.55;font-size:13px}
.empty{color:#8795a7;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>分支2 v2.2｜手机 B：只看答案</h1>
<div class="sub">收到整页试卷结果后，只显示<b>题号 + 答案</b>。不显示题干，不显示解析；公式尽量使用正常人阅读的数学/物理符号。</div>
<section class="card" id="card">
<label for="room">配对码</label><input id="room" class="code" autocomplete="off">
<button id="listen">启动接收</button><button id="stop" class="stop" disabled>停止接收</button>
<div class="status" id="status"><span class="dot"></span>尚未连接</div>
</section>
<section class="card">
<div class="answers"><div class="label">答案清单｜题号 + 答案</div><div class="answerText" id="answers">等待手机 A…</div></div>
<div class="meta" id="meta">尚未收到结果</div>
<div class="grid2"><button id="copy">复制全部答案</button><button id="clear">清空记录</button></div>
</section>
<section class="card"><b>最近收到的答案</b><div class="history" id="history"><div class="empty">暂无记录</div></div></section>
</div>
<script>
(()=>{
const NTFY_BASE='https://ntfy.sh';
const roomEl=document.getElementById('room'),statusEl=document.getElementById('status'),card=document.getElementById('card');
const answersEl=document.getElementById('answers'),metaEl=document.getElementById('meta'),historyEl=document.getElementById('history');
const listenBtn=document.getElementById('listen'),stopBtn=document.getElementById('stop');
let es=null,lastId='',records=[];const batches=new Map();
function sanitizeRoom(s){return(s||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,64)}
function extractAnswers(text){let t=String(text||'').trim();const markers=['【答案】','【答案总览】'];for(const m of markers){const p=t.indexOf(m);if(p>=0){t=t.slice(p+m.length).trim();break}}const cut=['【详细解析】','【识别说明】'];for(const m of cut){const p=t.indexOf(m);if(p>=0)t=t.slice(0,p).trim()}return t||'未提取到答案'}
function renderHistory(){historyEl.innerHTML='';if(!records.length){historyEl.innerHTML='<div class="empty">暂无记录</div>';return}records.slice(0,10).forEach(r=>{const d=document.createElement('div');d.className='item';const tm=document.createElement('div');tm.className='itemTime';tm.textContent=new Date(r.createdAt).toLocaleString('zh-CN',{hour12:false});const tx=document.createElement('div');tx.className='itemText';tx.textContent=extractAnswers(r.text);d.append(tm,tx);historyEl.appendChild(d)})}
function show(text,createdAt){const clean=extractAnswers(text);answersEl.textContent=clean;metaEl.textContent='收到时间：'+new Date(createdAt||Date.now()).toLocaleString('zh-CN',{hour12:false});records.unshift({createdAt:createdAt||Date.now(),text:clean});records=records.slice(0,10);renderHistory()}
function startListening(){const room=sanitizeRoom(roomEl.value);if(!room){statusEl.textContent='请先填写配对码';return}if(!('EventSource'in window)){statusEl.textContent='当前浏览器不支持实时接收';return}if(es)es.close();es=new EventSource(NTFY_BASE+'/'+encodeURIComponent('cai-'+room)+'/sse');card.classList.add('live');listenBtn.disabled=true;stopBtn.disabled=false;roomEl.disabled=true;localStorage.setItem('branch2_qa_room',room);statusEl.innerHTML='<span class="dot"></span>正在连接…';es.onopen=()=>statusEl.innerHTML='<span class="dot"></span>已连接，等待手机 A 拍卷子';es.onmessage=e=>{try{const data=JSON.parse(e.data);if(data.event!=='message'||!data.message)return;if(data.id&&data.id===lastId)return;lastId=data.id||'';let p;try{p=JSON.parse(data.message)}catch{p={kind:'legacy',createdAt:Date.now(),text:data.message}}if(p.kind==='branch2-answer-only-chunk-v2.2'){const id=p.batchId||'';if(!id||!Number.isInteger(p.index)||!Number.isInteger(p.total))return;let b=batches.get(id);if(!b){b={createdAt:p.createdAt||Date.now(),total:p.total,parts:new Array(p.total),count:0};batches.set(id,b)}if(b.parts[p.index]===undefined){b.parts[p.index]=String(p.chunk||'');b.count++}statusEl.innerHTML='<span class="dot"></span>正在接收答案：'+b.count+'/'+b.total;if(b.count===b.total){const text=b.parts.join('');batches.delete(id);show(text,b.createdAt);statusEl.innerHTML='<span class="dot"></span>已收到答案，继续等待'}}else{show(p.text||data.message,p.createdAt||Date.now());statusEl.innerHTML='<span class="dot"></span>已收到新答案，继续等待'}}catch{}};es.onerror=()=>statusEl.innerHTML='<span class="dot"></span>连接中断，正在自动重连…'}
function stopListening(){if(es){es.close();es=null}card.classList.remove('live');listenBtn.disabled=false;stopBtn.disabled=true;roomEl.disabled=false;statusEl.innerHTML='<span class="dot"></span>已停止'}
const q=new URLSearchParams(location.search).get('room');roomEl.value=sanitizeRoom(q||localStorage.getItem('branch2_qa_room')||'');roomEl.onchange=()=>localStorage.setItem('branch2_qa_room',sanitizeRoom(roomEl.value));listenBtn.onclick=startListening;stopBtn.onclick=stopListening;document.getElementById('copy').onclick=async()=>{const text=answersEl.textContent.trim();try{await navigator.clipboard.writeText(text);metaEl.textContent='答案已复制'}catch{prompt('复制答案：',text)}};document.getElementById('clear').onclick=()=>{records=[];renderHistory()};
})();
</script>
</body>
</html>
