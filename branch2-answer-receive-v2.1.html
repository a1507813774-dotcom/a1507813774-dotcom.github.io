<!--
项目：分支2｜双手机整页试卷作答中继
页面：手机 B（接收 / 题号答案总览 / 逐题解析）
作用：手机 B 不拍照、不调用 Gemini；仅接收手机 A 的整页试卷作答结果。顶部突出显示所有“题号 + 答案”，下方显示逐题解析和识别说明。
版本：v2.1-branch2-full-paper-answer
修改日期：2026-09-10
基础版本：v2.0-branch2-question-answer
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>分支2 v2.1｜手机B 整页答案</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px}
h1{font-size:24px;margin:4px 0 8px}
.sub{color:#9aa7b7;font-size:14px;line-height:1.6}
.card{background:#121821;border:1px solid #263140;border-radius:18px;padding:14px;margin-top:14px}
label{display:block;color:#cbd4df;font-size:13px;margin-bottom:6px}
input{width:100%;border:1px solid #334154;background:#0c1219;color:#fff;border-radius:11px;padding:11px 12px;font-size:14px}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
button{width:100%;border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:700;background:#2389ff;color:#fff;margin-top:10px}
button.stop{background:#7a2529}
.status{margin-top:10px;color:#9aa7b7;font-size:13px;white-space:pre-wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:7px}
.live .dot{background:#38d47a}
.overview{margin-top:10px;background:#0c1b13;border:1px solid #2b6844;border-radius:14px;padding:15px;min-height:110px}
.label{font-size:12px;color:#8fd8aa;margin-bottom:8px}
.overviewText{font-size:21px;font-weight:800;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.analysis{margin-top:12px;background:#0c1219;border:1px solid #263140;border-radius:12px;padding:14px;min-height:180px;line-height:1.68;white-space:pre-wrap;word-break:break-word;font-size:14px}
.meta{font-size:12px;color:#9aa7b7;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 button{margin-top:10px;background:#283342}
.history{margin-top:10px;display:grid;gap:8px}
.item{background:#0c1219;border:1px solid #263140;border-radius:10px;padding:10px}
.itemTime{font-size:11px;color:#7f8c9d;margin-bottom:5px}
.itemText{white-space:pre-wrap;line-height:1.5;font-size:13px}
.empty{color:#8795a7;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>分支2 v2.1｜手机 B：整页文字答案</h1>
<div class="sub">收到一整页试卷后，顶部只突出<b>题号 + 答案</b>，不重复抄写整段题干；下面再显示每题的简明解析。</div>

<section class="card" id="card">
  <label for="room">配对码</label><input id="room" class="code" autocomplete="off">
  <button id="listen">启动接收</button><button id="stop" class="stop" disabled>停止接收</button>
  <div class="status" id="status"><span class="dot"></span>尚未连接</div>
</section>

<section class="card">
  <div class="overview">
    <div class="label">答案总览｜题号 + 答案</div>
    <div class="overviewText" id="overview">等待手机 A…</div>
  </div>
  <div class="meta" id="meta">尚未收到结果</div>
  <div class="grid2"><button id="copyAnswer">复制答案总览</button><button id="clearHistory">清空记录</button></div>
  <div class="analysis" id="analysis">【详细解析】与【识别说明】会显示在这里。</div>
</section>

<section class="card"><b>最近收到的答案总览</b><div class="history" id="history"><div class="empty">暂无记录</div></div></section>
</div>

<script>
(()=>{
const NTFY_BASE='https://ntfy.sh';
const roomEl=document.getElementById('room'),statusEl=document.getElementById('status'),card=document.getElementById('card');
const overviewEl=document.getElementById('overview'),analysisEl=document.getElementById('analysis'),metaEl=document.getElementById('meta'),historyEl=document.getElementById('history');
const listenBtn=document.getElementById('listen'),stopBtn=document.getElementById('stop');
let es=null,lastId='',records=[];const batches=new Map();

function sanitizeRoom(s){return(s||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,64)}
function section(text,name,nextNames){
  const source=String(text||'');
  const start=source.indexOf('【'+name+'】');
  if(start<0)return '';
  let from=start+name.length+2,end=source.length;
  for(const n of nextNames){
    const p=source.indexOf('【'+n+'】',from);
    if(p>=0&&p<end)end=p;
  }
  return source.slice(from,end).trim();
}
function extractOverview(text){
  const t=section(text,'答案总览',['详细解析','识别说明']);
  if(t)return t;
  return String(text||'').trim()||'未提取到答案';
}
function extractAnalysis(text){
  const detail=section(text,'详细解析',['识别说明']);
  const note=section(text,'识别说明',[]);
  let out='';
  if(detail)out+='【详细解析】\n'+detail;
  if(note)out+=(out?'\n\n':'')+'【识别说明】\n'+note;
  return out||String(text||'').trim()||'没有解析内容';
}
function renderHistory(){
  historyEl.innerHTML='';
  if(!records.length){historyEl.innerHTML='<div class="empty">暂无记录</div>';return}
  records.slice(0,10).forEach(r=>{
    const d=document.createElement('div');d.className='item';
    const t=document.createElement('div');t.className='itemTime';t.textContent=new Date(r.createdAt).toLocaleString('zh-CN',{hour12:false});
    const x=document.createElement('div');x.className='itemText';x.textContent=extractOverview(r.text);
    d.append(t,x);historyEl.appendChild(d);
  });
}
function showPayload(p){
  const text=String(p.text||'').trim();if(!text)return;
  overviewEl.textContent=extractOverview(text);
  analysisEl.textContent=extractAnalysis(text);
  metaEl.textContent='收到时间：'+new Date(p.createdAt||Date.now()).toLocaleString('zh-CN',{hour12:false});
  records.unshift({createdAt:p.createdAt||Date.now(),text});records=records.slice(0,10);renderHistory();
}
function startListening(){
  const room=sanitizeRoom(roomEl.value);
  if(!room){statusEl.textContent='请先填写配对码';return}
  if(!('EventSource'in window)){statusEl.textContent='当前浏览器不支持实时接收';return}
  if(es)es.close();
  es=new EventSource(NTFY_BASE+'/'+encodeURIComponent('cai-'+room)+'/sse');
  card.classList.add('live');listenBtn.disabled=true;stopBtn.disabled=false;roomEl.disabled=true;
  statusEl.innerHTML='<span class="dot"></span>正在连接…';localStorage.setItem('branch2_qa_room',room);
  es.onopen=()=>statusEl.innerHTML='<span class="dot"></span>已连接，等待手机 A 拍整页试卷';
  es.onmessage=e=>{
    try{
      const data=JSON.parse(e.data);
      if(data.event!=='message'||!data.message)return;
      if(data.id&&data.id===lastId)return;
      lastId=data.id||'';
      let payload;
      try{payload=JSON.parse(data.message)}catch{payload={kind:'legacy',createdAt:Date.now(),text:data.message}}
      if(payload.kind==='branch2-full-paper-chunk-v2.1'){
        const id=payload.batchId||'';
        if(!id||!Number.isInteger(payload.index)||!Number.isInteger(payload.total))return;
        let b=batches.get(id);
        if(!b){b={createdAt:payload.createdAt||Date.now(),total:payload.total,parts:new Array(payload.total),count:0};batches.set(id,b)}
        if(b.parts[payload.index]===undefined){b.parts[payload.index]=String(payload.chunk||'');b.count++}
        statusEl.innerHTML='<span class="dot"></span>正在接收整页答案：'+b.count+'/'+b.total;
        if(b.count===b.total){
          const text=b.parts.join('');batches.delete(id);
          showPayload({createdAt:b.createdAt,text});
          statusEl.innerHTML='<span class="dot"></span>已收到整页答案，继续等待';
        }
      }else{
        showPayload(payload);
        statusEl.innerHTML='<span class="dot"></span>已收到新答案，继续等待';
      }
    }catch{}
  };
  es.onerror=()=>statusEl.innerHTML='<span class="dot"></span>连接中断，正在自动重连…';
}
function stopListening(){
  if(es){es.close();es=null}
  card.classList.remove('live');listenBtn.disabled=false;stopBtn.disabled=true;roomEl.disabled=false;
  statusEl.innerHTML='<span class="dot"></span>已停止';
}

const q=new URLSearchParams(location.search).get('room');
roomEl.value=sanitizeRoom(q||localStorage.getItem('branch2_qa_room')||'');
roomEl.onchange=()=>localStorage.setItem('branch2_qa_room',sanitizeRoom(roomEl.value));
listenBtn.onclick=startListening;stopBtn.onclick=stopListening;
document.getElementById('copyAnswer').onclick=async()=>{
  const text=overviewEl.textContent.trim();
  try{await navigator.clipboard.writeText(text);metaEl.textContent='答案总览已复制'}catch{prompt('复制答案总览：',text)}
};
document.getElementById('clearHistory').onclick=()=>{records=[];renderHistory()};
})();
</script>
</body>
</html>
