name: Build AudioOneTap v1.3 32 kbps APK
on:
  push:
    branches:
      - build-youtube-audio-32k-20261121
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack reviewed v1.3 source
        run: |
          unzip -q source/AudioOneTap-v1.3-source.zip
          mv AudioOneTap_v1_3_Source app-project
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle yt-dlp version
        run: |
          mkdir -p app-project/app/src/main/res/raw
          curl --retry 3 -fLsS 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp' -o app-project/app/src/main/res/raw/ytdlp
          python3 app-project/app/src/main/res/raw/ytdlp --version | tee /tmp/yt-version
          grep -qx '2026.10.26' /tmp/yt-version
      - name: Build APK
        working-directory: app-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          cp app-project/app/build/outputs/apk/debug/app-debug.apk AudioOneTap-v1.3-arm64.apk
          python3 - <<'PYCODE'
          import zipfile
          p='AudioOneTap-v1.3-arm64.apk'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'lib/arm64-v8a/libqjs.so' in names
              assert 'res/raw/ytdlp' in names
              print('APK bytes:',len(open(p,'rb').read()))
          PYCODE
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioOneTap-v1.3-arm64
          path: AudioOneTap-v1.3-arm64.apk
          if-no-files-found: error
