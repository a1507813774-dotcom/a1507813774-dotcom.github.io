name: Build SignalMeter APK

on:
  push:
    branches:
      - build-signalmeter-v0.1.0
    paths:
      - 'build-assets/SignalMeter_v0.1.0_2026-09-10.zip.b64'
      - '.github/workflows/build-signalmeter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Restore SignalMeter source
        run: |
          mkdir -p build-work
          base64 -d build-assets/SignalMeter_v0.1.0_2026-09-10.zip.b64 > build-work/SignalMeter.zip
          unzip -q build-work/SignalMeter.zip -d build-work

      - name: Build debug APK
        working-directory: build-work/SignalMeter_v0.1.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp build-work/SignalMeter_v0.1.0/app/build/outputs/apk/debug/app-debug.apk SignalMeter-v0.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalMeter-v0.1.0-apk
          path: SignalMeter-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
