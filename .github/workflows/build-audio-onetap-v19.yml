name: AudioOneTap v1.9 original audio and Drive auto-upload
on:
  push:
    branches: [build-audio-onetap-v19-drive-auto]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack source
        run: |
          unzip -q source/AudioOneTap-v1.9-source.zip
          test -f AudioOneTap_v1_9_Source/app/src/main/java/com/onec/audio/DriveUploadWorker.java
          test -f AudioOneTap_v1_9_Source/app/src/main/java/com/onec/audio/DriveApiUploader.java
          test ! -e AudioOneTap_v1_9_Source/app/src/main/java/com/onec/audio/AudioTranscoder.java
          grep -q 'versionCode 10' AudioOneTap_v1_9_Source/app/build.gradle
          grep -q 'DriveUploadWorker.enqueue' AudioOneTap_v1_9_Source/app/src/main/java/com/onec/audio/AudioService.java
          grep -q 'expectedDurationMs' AudioOneTap_v1_9_Source/app/src/main/java/com/onec/audio/AudioService.java
          mv AudioOneTap_v1_9_Source app-project
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle verified yt-dlp
        run: |
          mkdir -p app-project/app/src/main/res/raw
          curl --retry 3 -fLsS 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp' -o app-project/app/src/main/res/raw/ytdlp
          python3 app-project/app/src/main/res/raw/ytdlp --version | grep -qx '2026.10.26'
      - name: Compile APK
        working-directory: app-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Android package
        run: |
          mkdir -p result
          cp app-project/app/build/outputs/apk/debug/app-debug.apk result/AudioOneTap-v1.9-base.apk
          python3 - <<'PYCODE'
          import zipfile,os
          p='result/AudioOneTap-v1.9-base.apk'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert 'classes.dex' in names
              assert 'lib/arm64-v8a/libqjs.so' in names
              assert 'res/raw/ytdlp' in names
          print('Verified app bytes',os.stat(p).st_size)
          PYCODE
      - name: Publish build
        uses: actions/upload-artifact@v4
        with:
          name: AudioOneTap-v1.9-base
          path: result/AudioOneTap-v1.9-base.apk
          if-no-files-found: error

# Build based on verified v1.8 audio download path
