name: MinuteLedger cloud archive

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Lookback calendar days. Long Alpaca backfills are supported; Yahoo 1m remains recent-only."
        required: false
        default: "3650"
  schedule:
    - cron: "20 10 * * 1-5"
    - cron: "20 22 * * 1-5"
  push:
    branches: ["main"]
    paths:
      - "stock/cloud_collector.py"
      - "stock/cloud_config.json"
      - ".github/workflows/minute-ledger-cloud.yml"

permissions:
  contents: write

concurrency:
  group: minute-ledger-cloud
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and commit shared minute archive
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED || 'sip' }}
          DISPATCH_DAYS: ${{ inputs.backfill_days }}
        run: |
          set -e
          git config user.name "MinuteLedger Cloud"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Archive attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            unset CLOUD_BACKFILL_DAYS || true
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DISPATCH_DAYS" ]; then
              export CLOUD_BACKFILL_DAYS="$DISPATCH_DAYS"
            fi

            python stock/cloud_collector.py
            git add stock/cloud_data

            if git diff --cached --quiet; then
              echo "No archive changes."
              exit 0
            fi

            git commit -m "Update MinuteLedger cloud archive"
            if git push origin HEAD:main; then
              echo "Archive push succeeded."
              exit 0
            fi

            echo "Main changed during collection; retrying from latest main."
          done

          echo "Archive push failed after 3 attempts."
          exit 1
