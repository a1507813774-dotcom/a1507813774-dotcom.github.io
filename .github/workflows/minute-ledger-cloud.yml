name: MinuteLedger cloud archive

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Lookback days. Yahoo 1m is limited to recent weeks; with Alpaca secrets this may be set up to 400."
        required: false
        default: "28"
  schedule:
    - cron: "20 10 * * 1-5"
    - cron: "20 22 * * 1-5"
  push:
    branches: ["main"]
    paths:
      - "stock/cloud_collector.py"
      - "stock/cloud_config.json"
      - ".github/workflows/minute-ledger-cloud.yml"

permissions:
  contents: write

concurrency:
  group: minute-ledger-cloud
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect shared minute archive
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED || 'iex' }}
          DISPATCH_DAYS: ${{ inputs.backfill_days }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$DISPATCH_DAYS" ]; then
            export CLOUD_BACKFILL_DAYS="$DISPATCH_DAYS"
          fi
          python stock/cloud_collector.py

      - name: Commit updated cloud archive
        run: |
          git config user.name "MinuteLedger Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add stock/cloud_data
          if git diff --cached --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git commit -m "Update MinuteLedger cloud archive"
          git pull --rebase origin main
          git push origin HEAD:main
