<!-- 项目：分支2 双手机拍题作答中继｜作用：手机A开启视频、拍题、Gemini作答并把文字结果发送到手机B｜版本：v2.0｜日期：2026-09-10 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>分支2｜手机A拍题</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:760px;margin:auto;padding:16px}h1{font-size:23px}.sub,.s{color:#9aa7b7;line-height:1.55;font-size:13px}.c{background:#121821;border:1px solid #263140;border-radius:16px;padding:14px;margin-top:13px}.p{background:#000;border-radius:13px;overflow:hidden;aspect-ratio:3/4;max-height:68vh;position:relative}.p video{width:100%;height:100%;object-fit:cover}.b{position:absolute;top:9px;left:9px;background:#000b;padding:7px;border-radius:9px}.g{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}button{border:0;border-radius:11px;padding:13px 8px;background:#283342;color:#fff;font-weight:700;font-size:15px}.blue{background:#2389ff}.green{background:#176b3a}.red{background:#7a2529}button:disabled{opacity:.45}label{display:block;color:#cbd4df;font-size:12px;margin:8px 0 5px}input,select{width:100%;padding:11px;background:#0c1219;color:#fff;border:1px solid #334154;border-radius:10px}.mono{font-family:monospace;word-break:break-all}.status{margin-top:9px;white-space:pre-wrap;color:#9aa7b7;font-size:13px;line-height:1.55}.ok{color:#71e49f}canvas{display:none}@media(min-width:700px){.p{aspect-ratio:16/10}}</style></head><body><div class="w"><h1>分支2｜手机 A：视频拍题 → AI 作答 → 手机 B</h1><div class="sub">先开启视频。题目完整进入画面后，点“拍题并作答”。完整文字答案会发送到另一部手机。</div><section class="c"><label>配对码</label><input id="room" class="mono"><div class="g"><button id="new">新配对码</button><button id="copy" class="green">复制手机 B 链接</button></div><div id="link" class="status"></div></section><section class="c"><div class="p"><video id="v" autoplay muted playsinline></video><div class="b" id="cam">视频未开启</div></div><div class="g"><button id="start" class="blue">开启视频</button><button id="stop" class="red" disabled>停止视频</button><button id="sw" disabled>切换摄像头</button><button id="solve" class="green" disabled>拍题并作答</button></div><div id="st" class="status">等待开启视频</div></section><section class="c"><b>固定任务</b><div class="s">识别画面中最主要的一道题，给出明确文字答案，并附简短解析。看不清时必须说明无法可靠识别，不能猜。</div><label>AI 后端地址（留空=当前网站）</label><input id="api" placeholder="例如：https://a1507813774-dotcom-github-io.vercel.app"><label>分析访问码（若未设置可留空）</label><input id="token" type="password"><label>识别精度</label><select id="detail"><option value="high">高：优先题目细节</option><option value="auto">自动</option><option value="low">低：速度优先</option></select></section><canvas id="cv"></canvas></div><script>(()=>{const N='https://ntfy.sh',P=`你是做题助手。读取图片中最主要、最完整的一道题并作答。严格按以下格式输出，不要使用Markdown：
【题目】
完整题目；选择题保留选项。
【答案】
给出明确答案；选择题写选项字母和内容，计算题写最终结果，判断题写正确或错误。
【解析】
给出简短、可核验的解析。
如果图片模糊、题干不全或无法可靠识别，不要猜；在【答案】写“无法可靠识别”，并在【解析】说明原因。`;const $=id=>document.getElementById(id),v=$('v'),cv=$('cv'),x=cv.getContext('2d'),room=$('room'),api=$('api'),token=$('token'),detail=$('detail'),cam=$('cam'),st=$('st'),solve=$('solve');let stream=null,facing='environment',busy=false;function rnd(){let a=new Uint8Array(16);crypto.getRandomValues(a);return[...a].map(b=>b.toString(16).padStart(2,'0')).join('')}function sr(s){return(s||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,64)}function bUrl(){return location.origin+location.pathname.replace(/branch2-question-send-v2\.0\.html.*$/,'branch2-answer-receive-v2.0.html')+'?room='+encodeURIComponent(sr(room.value))}function roomUI(){let r=sr(room.value);if(!r)room.value=r=rnd();localStorage.setItem('branch2_qa_room',r);$('link').textContent='手机 B 打开：'+bUrl()}async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:2560},height:{ideal:1440}},audio:false});v.srcObject=stream;await v.play();cam.textContent='视频已开启';$('start').disabled=true;$('stop').disabled=false;$('sw').disabled=false;solve.disabled=false;st.textContent='把题目完整放进画面，然后点“拍题并作答”'}catch(e){st.textContent='摄像头失败：'+e.message}}function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;cam.textContent='视频已停止';$('start').disabled=false;$('stop').disabled=true;$('sw').disabled=true;solve.disabled=true}async function shot(){if(!stream||v.readyState<2)throw Error('视频未准备好');let w=v.videoWidth,h=v.videoHeight,m=2200,q=Math.min(1,m/Math.max(w,h));cv.width=Math.round(w*q);cv.height=Math.round(h*q);x.drawImage(v,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(r,'image/jpeg',.9))}function dataurl(b){return new Promise((r,j)=>{let f=new FileReader;f.onload=()=>r(f.result);f.onerror=()=>j(f.error);f.readAsDataURL(b)})}function ep(){let a=api.value.trim().replace(/\/$/,'');return a?a+'/api/analyze':'/api/analyze'}async function send(text){let r=sr(room.value);let payload=JSON.stringify({kind:'branch2-question-answer',createdAt:Date.now(),text});let z=await fetch(N+'/'+encodeURIComponent('cai-'+r)+'?cache=no',{method:'POST',body:payload});if(!z.ok)throw Error('发送失败 HTTP '+z.status)}async function run(){if(busy)return;busy=true;solve.disabled=true;try{st.textContent='正在拍下题目…';let b=await shot();st.textContent='正在识别并作答…';let image=await dataurl(b);let r=await fetch(ep(),{method:'POST',headers:{'Content-Type':'application/json','X-Analyze-Token':token.value.trim()},body:JSON.stringify({image,prompt:P,detail:detail.value})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Gemini HTTP '+r.status);let text=(d.text||'').trim();if(!text)throw Error('AI没有返回答案');st.textContent='AI 已作答，正在发送…';await send(text);st.innerHTML='<span class="ok">已发送到手机 B</span> · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){st.textContent='失败：'+e.message}finally{busy=false;solve.disabled=!stream}}$('new').onclick=()=>{room.value=rnd();roomUI()};$('copy').onclick=async()=>{roomUI();try{await navigator.clipboard.writeText(bUrl());st.textContent='手机 B 链接已复制'}catch{prompt('复制到手机 B：',bUrl())}};room.onchange=roomUI;$('start').onclick=start;$('stop').onclick=stop;$('sw').onclick=async()=>{facing=facing==='environment'?'user':'environment';await start()};solve.onclick=run;api.value=localStorage.getItem('ai_api_base')||'';detail.value=localStorage.getItem('branch2_qa_detail')||'high';api.onchange=()=>localStorage.setItem('ai_api_base',api.value.trim());detail.onchange=()=>localStorage.setItem('branch2_qa_detail',detail.value);room.value=localStorage.getItem('branch2_qa_room')||rnd();roomUI()})();</script></body></html>
